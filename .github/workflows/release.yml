name: Publish Release (Modrinth & CurseForge)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      version_type:
        description: 'Version type'
        required: true
        type: choice
        options:
          - release
          - beta
          - alpha
        default: 'release'
      changelog:
        description: 'Changelog / Release notes'
        required: false
        default: 'Release of OPAC Combat Log'

jobs:
  build:
    name: Build Distribution Jars
    runs-on: ubuntu-latest
    env:
      _JAVA_OPTIONS: "-Djava.net.preferIPv4Stack=true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build All Distribution Jars
        run: ./gradlew --no-daemon :neoforge:1.21.1:remapJar :fabric:1.21.1:remapJar :fabric:1.20.1:remapJar :forge:1.20.1:remapJar :neoforge:26.1:assemble

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distribution-jars
          path: |
            forge/versions/1.20.1/build/libs/opac-combatlog-1.20.1-forge.jar
            fabric/versions/1.20.1/build/libs/opac-combatlog-1.20.1-fabric.jar
            neoforge/versions/1.21.1/build/libs/opac-combatlog-1.21.1-neoforge.jar
            fabric/versions/1.21.1/build/libs/opac-combatlog-1.21.1-fabric.jar
            neoforge/versions/26.1/build/libs/opac-combatlog-26.1-neoforge.jar

  publish:
    name: Publish to CurseForge & Modrinth
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "1.20.1 Forge"
            mc: "1.20.1"
            loader: "forge"
            file: "forge/versions/1.20.1/build/libs/opac-combatlog-1.20.1-forge.jar"
            dependencies: |
              open-parties-and-claims(required)
              open-parties-and-claims-warfare(optional)
          - target: "1.20.1 Fabric"
            mc: "1.20.1"
            loader: "fabric"
            file: "fabric/versions/1.20.1/build/libs/opac-combatlog-1.20.1-fabric.jar"
            dependencies: |
              open-parties-and-claims(required)
              fabric-api(required)
              open-parties-and-claims-warfare(optional)
          - target: "1.21.1 NeoForge"
            mc: "1.21.1"
            loader: "neoforge"
            file: "neoforge/versions/1.21.1/build/libs/opac-combatlog-1.21.1-neoforge.jar"
            dependencies: |
              open-parties-and-claims(required)
              open-parties-and-claims-warfare(optional)
          - target: "1.21.1 Fabric"
            mc: "1.21.1"
            loader: "fabric"
            file: "fabric/versions/1.21.1/build/libs/opac-combatlog-1.21.1-fabric.jar"
            dependencies: |
              open-parties-and-claims(required)
              fabric-api(required)
              open-parties-and-claims-warfare(optional)
          - target: "26.1 NeoForge"
            mc: "26.1.2"
            loader: "neoforge"
            file: "neoforge/versions/26.1/build/libs/opac-combatlog-26.1-neoforge.jar"
            dependencies: |
              open-parties-and-claims(required)
              open-parties-and-claims-warfare(optional)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: distribution-jars

      - name: Determine Version
        id: version_step
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_VER="${GITHUB_REF_NAME#v}"
          else
            RAW_VER=$(grep "mod_version=" gradle.properties | cut -d'=' -f2 | tr -d ' \r\n')
          fi
          echo "VERSION=${RAW_VER}" >> $GITHUB_ENV

      - name: Publish ${{ matrix.target }}
        uses: Kira-NT/mc-publish@v3.3.2
        continue-on-error: true
        with:
          curseforge-id: "1771429"
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: "TMGXQEZH"
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ matrix.file }}
          name: "OPAC Combat Log v${{ env.VERSION }} [${{ matrix.target }}]"
          version: "${{ env.VERSION }}+${{ matrix.mc }}-${{ matrix.loader }}"
          version-type: ${{ github.event.release.prerelease && 'beta' || inputs.version_type || 'release' }}
          changelog: ${{ github.event.release.body || inputs.changelog || 'https://github.com/SvinPepe/opac-combatlog/releases' }}
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.mc }}
          dependencies: ${{ matrix.dependencies }}
