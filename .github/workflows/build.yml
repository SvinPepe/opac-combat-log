name: Build & Test

on:
  push:
    branches:
      - master
      - main
      - 'feature/**'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Matrix
    runs-on: ubuntu-latest
    env:
      _JAVA_OPTIONS: "-Djava.net.preferIPv4Stack=true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew --no-daemon :common:1.21.1:test :common:1.20.1:test :common:26.1:test

      - name: Build All Distribution Jars
        run: ./gradlew --no-daemon :neoforge:1.21.1:remapJar :fabric:1.21.1:remapJar :fabric:1.20.1:remapJar :forge:1.20.1:remapJar :neoforge:26.1:assemble

      - name: Upload Mod Jar Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opac-combatlog-jars
          path: |
            forge/versions/1.20.1/build/libs/opac-combatlog-1.20.1-forge.jar
            fabric/versions/1.20.1/build/libs/opac-combatlog-1.20.1-fabric.jar
            neoforge/versions/1.21.1/build/libs/opac-combatlog-1.21.1-neoforge.jar
            fabric/versions/1.21.1/build/libs/opac-combatlog-1.21.1-fabric.jar
            neoforge/versions/26.1/build/libs/opac-combatlog-26.1-neoforge.jar
          if-no-files-found: error
