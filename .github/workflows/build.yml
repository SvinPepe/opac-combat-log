name: Build & Test

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle & Run Tests
        run: ./gradlew build --stacktrace

      - name: Upload Mod Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opac-combatlog-jar
          path: neoforge/build/libs/opac-combatlog-*.jar
          if-no-files-found: error
